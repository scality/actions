name: 'Test Bump version'

on:
  push:
    paths:
      - 'xcore/bump_version_pull_request/**'
      - '.github/workflows/bump_version.yaml'

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: create fake version file
        run: |
          echo "VERSION=1.2.3" > VERSION
      - name: Ensure leftover bump branch is removed
        env:
          BUMP_BRANCH: feature/bump_version_1.2.4
        run: |
          set +e
          git branch -D "${BUMP_BRANCH}" 2>/dev/null
          git push --delete origin "${BUMP_BRANCH}" 2>/dev/null
          set -e
          echo "Leftover branch cleanup done (ignore delete errors if branch was absent)"

      - uses: ./xcore/bump_version_pull_request
        id: pull-request
      - name: check version is bumped
        run: |
          grep -q "VERSION=1.2.4" ./VERSION
      - name: check pr exists
        run: |
          gh pr view ${{ steps.pull-request.outputs.pull-request-url }}
      - name: close pr
        if: always() && steps.pull-request.outputs.pull-request-url != ''
        run: |
          # fetch latest git info first
          git fetch --all
          gh pr close -d ${{ steps.pull-request.outputs.pull-request-url }}
